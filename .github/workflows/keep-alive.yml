# Once a day: keep the free hosting awake (moved here from the private game repository, whose free Actions minutes
# can run out; this repository is public, so its minutes are free).
# Supabase's free plan pauses a project after 7 days without database activity, and a paused project needs a manual
# restore in the dashboard; one tiny read a day (the Lumen collections, public anyway) counts as activity. The co-op
# server is only looked at (that wakes it for 15 minutes). Uses only the public key every copy of the game carries.
name: Keep alive

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read from the database
        run: |
          URL=https://odnjaegbkudwsfrwnjiy.supabase.co; KEY=sb_publishable_IUdpT3MRtokyJD3SsNNF0Q_eZAovpor
          CODE=$(curl -s -o out.json -w '%{http_code}' "$URL/rest/v1/lumen_collections?select=id&limit=1" -H "apikey: $KEY")
          echo "HTTP $CODE"; cat out.json; echo
          [ "$CODE" = "200" ]
      - name: Co-op server (report only)
        run: |
          curl -s -m 10 https://lantern-keeper-coop.onrender.com/health && echo " (awake)" || echo "asleep (normal on the free plan)"
