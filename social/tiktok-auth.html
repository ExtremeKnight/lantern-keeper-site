<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TikTok sign-in · Lantern Keeper</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10162e; color: #eef0fa; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; padding: 24px; }
  code { display: block; margin: 12px 0; padding: 12px; border-radius: 10px; background: #1a2345; border: 1px solid #38426f; word-break: break-all; font-size: 14px; }
  button { padding: 10px 18px; border: 0; border-radius: 10px; background: #ffcf66; color: #261b04; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>TikTok sign-in</h1>
  <!-- For the owner's one-time autopilot setup (tools/autopost-auth.js tiktok). This page only shows the code TikTok put in
       the address; nothing is sent anywhere. -->
  <p id="msg">Waiting for TikTok…</p>
  <code id="code" hidden></code>
  <button id="copy" hidden type="button">Copy the code</button>
</main>
<script>
  const q = new URLSearchParams(location.search), code = q.get('code'), err = q.get('error_description') || q.get('error');
  const msg = document.getElementById('msg'), box = document.getElementById('code'), btn = document.getElementById('copy');
  if (code) { msg.textContent = 'Copy this code and paste it into the terminal where tools/autopost-auth.js is waiting. It works once, for a few minutes.'; box.textContent = code; box.hidden = false; btn.hidden = false;
    btn.onclick = () => navigator.clipboard.writeText(code).then(() => { btn.textContent = 'Copied'; }); }
  else if (err) msg.textContent = 'TikTok said: ' + err;
  else msg.textContent = 'This page is for the owner\'s one-time TikTok setup. There is nothing to do here.';
</script>
</body>
</html>
